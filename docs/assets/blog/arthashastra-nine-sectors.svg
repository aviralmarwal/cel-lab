<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Outfit,system-ui,sans-serif"><rect width="900" height="640" fill="#fff"/><text x="30" y="30" font-size="15" font-weight="600" fill="#16222e">The fortified city in the Arthashastra, Book II, Chapter IV</text><text x="30" y="48" font-size="12" fill="#737b84">Six royal roads, three east–west and three north–south, divide the city into nine sectors. Schematic, after the text; not to scale.</text><rect x="94" y="74" width="502" height="502" fill="none" stroke="#a8c5da" stroke-width="10" opacity=".6"/><rect x="110" y="90" width="470" height="470" fill="#f7f4ee" stroke="#1a3a5c" stroke-width="3"/><rect x="274.0" y="104.0" width="142.0" height="142.0" fill="#1a3a5c" opacity=".92"/><text x="282.0" y="124.0" font-size="11.5" font-weight="600" fill="#fff" letter-spacing="1">NORTH</text><text x="282.0" y="144.0" font-size="12" fill="#fff">Royal palace, core</text><text x="282.0" y="159.0" font-size="12" fill="#fff">administration</text><rect x="424.0" y="104.0" width="142.0" height="142.0" fill="#4a90c4" opacity=".92"/><text x="432.0" y="124.0" font-size="11.5" font-weight="600" fill="#fff" letter-spacing="1">NORTH-EAST</text><text x="432.0" y="144.0" font-size="12" fill="#fff">Priests, royal</text><text x="432.0" y="159.0" font-size="12" fill="#fff">teachers, ministers;</text><text x="432.0" y="174.0" font-size="12" fill="#fff">sacrificial ground,</text><text x="432.0" y="189.0" font-size="12" fill="#fff">water reservoir</text><rect x="424.0" y="254.0" width="142.0" height="142.0" fill="#0e7c7b" opacity=".92"/><text x="432.0" y="274.0" font-size="11.5" font-weight="600" fill="#fff" letter-spacing="1">EAST</text><text x="432.0" y="294.0" font-size="12" fill="#fff">Merchants, skilled</text><text x="432.0" y="309.0" font-size="12" fill="#fff">artisans, Kshatriyas</text><rect x="424.0" y="404.0" width="142.0" height="142.0" fill="#5a9e6f" opacity=".92"/><text x="432.0" y="424.0" font-size="11.5" font-weight="600" fill="#fff" letter-spacing="1">SOUTH-EAST</text><text x="432.0" y="444.0" font-size="12" fill="#fff">Royal kitchen,</text><text x="432.0" y="459.0" font-size="12" fill="#fff">elephant stables,</text><text x="432.0" y="474.0" font-size="12" fill="#fff">storehouse</text><rect x="274.0" y="404.0" width="142.0" height="142.0" fill="#e8a020" opacity=".92"/><text x="282.0" y="424.0" font-size="11.5" font-weight="600" fill="#16222e" letter-spacing="1">SOUTH</text><text x="282.0" y="444.0" font-size="12" fill="#16222e">City and army</text><text x="282.0" y="459.0" font-size="12" fill="#16222e">officials; traders in</text><text x="282.0" y="474.0" font-size="12" fill="#16222e">food and liquor;</text><text x="282.0" y="489.0" font-size="12" fill="#16222e">performers; Vaishyas</text><rect x="124.0" y="404.0" width="142.0" height="142.0" fill="#d4cfc8" opacity=".92"/><text x="132.0" y="424.0" font-size="11.5" font-weight="600" fill="#16222e" letter-spacing="1">SOUTH-WEST</text><rect x="124.0" y="254.0" width="142.0" height="142.0" fill="#9b8ea0" opacity=".92"/><text x="132.0" y="274.0" font-size="11.5" font-weight="600" fill="#fff" letter-spacing="1">WEST</text><text x="132.0" y="294.0" font-size="12" fill="#fff">Manufacturing</text><text x="132.0" y="309.0" font-size="12" fill="#fff">artisans: textiles,</text><text x="132.0" y="324.0" font-size="12" fill="#fff">weapons, mats;</text><text x="132.0" y="339.0" font-size="12" fill="#fff">Shudras</text><rect x="124.0" y="104.0" width="142.0" height="142.0" fill="#d4cfc8" opacity=".92"/><text x="132.0" y="124.0" font-size="11.5" font-weight="600" fill="#16222e" letter-spacing="1">NORTH-WEST</text><rect x="274.0" y="254.0" width="142.0" height="142.0" fill="#ece7dd" opacity=".92"/><text x="282.0" y="274.0" font-size="11.5" font-weight="600" fill="#16222e" letter-spacing="1">CENTRE</text><line x1="270.0" y1="90" x2="270.0" y2="560" stroke="#fff" stroke-width="7"/><line x1="110" y1="250.0" x2="580" y2="250.0" stroke="#fff" stroke-width="7"/><line x1="420.0" y1="90" x2="420.0" y2="560" stroke="#fff" stroke-width="7"/><line x1="110" y1="400.0" x2="580" y2="400.0" stroke="#fff" stroke-width="7"/><rect x="300.0" y="217.0" width="90.0" height="90.0" fill="none" stroke="#e8a020" stroke-width="2.5" stroke-dasharray="5 4"/><text x="345.0" y="332.5" font-size="11" fill="#16222e" text-anchor="middle">palace, slightly north of centre,</text><text x="345.0" y="352.0" font-size="11" fill="#16222e" text-anchor="middle">one-ninth of the city</text><rect x="620" y="100" width="14" height="14" fill="#1a3a5c" stroke="#cfc7b9"/><text x="642" y="112" font-size="12.5" fill="#3d4752">Rampart: 64 gates, 570 towers</text><rect x="620" y="126" width="14" height="14" fill="#a8c5da" stroke="#cfc7b9"/><text x="642" y="138" font-size="12.5" fill="#3d4752">Moat: 600 ft wide; also drainage</text><rect x="620" y="152" width="14" height="14" fill="#fff" stroke="#cfc7b9"/><text x="642" y="164" font-size="12.5" fill="#3d4752">Royal roads: 24 ft wide</text><text x="620" y="210" font-size="12.5" fill="#3d4752">One well for every ten houses.</text><text x="620" y="228" font-size="12.5" fill="#3d4752">A rain gauge (varshamana) in</text><text x="620" y="246" font-size="12.5" fill="#3d4752">front of the storehouse.</text><text x="620" y="264" font-size="12.5" fill="#3d4752">State support for orphans, the</text><text x="620" y="282" font-size="12.5" fill="#3d4752">elderly and the infirm.</text></svg>