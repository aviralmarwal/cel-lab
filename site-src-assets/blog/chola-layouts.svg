<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Outfit,system-ui,sans-serif"><rect width="900" height="420" fill="#fff"/><text x="30" y="30" font-size="15" font-weight="600" fill="#16222e">Two Chola layouts</text><text x="30" y="48" font-size="12" fill="#737b84">Left: the concentric village of the Kaveri delta. Right: the port city of Puhar as described in the Silappadikaram. Schematic.</text><circle cx="230" cy="240" r="160" fill="#5a9e6f" opacity=".9"/><circle cx="230" cy="240" r="118" fill="#97c08a" opacity=".9"/><circle cx="230" cy="240" r="78" fill="#e8a020" opacity=".9"/><circle cx="230" cy="240" r="40" fill="#1a3a5c" opacity=".9"/><text x="230" y="205" font-size="11.5" fill="#fff" text-anchor="middle">Core: houses</text><text x="230" y="184" font-size="11.5" fill="#16222e" text-anchor="middle">Processing: barns, drying floors, sugarcane ovens</text><text x="230" y="144" font-size="11.5" fill="#16222e" text-anchor="middle">Garden belt: coconut, turmeric, ginger</text><text x="230" y="102" font-size="11.5" fill="#fff" text-anchor="middle">Periphery: wide paddy fields</text><rect x="520" y="90" width="340" height="300" fill="#f7f4ee" stroke="#cfc7b9"/><rect x="830" y="90" width="30" height="300" fill="#a8c5da"/><text x="845" y="240.0" font-size="11" fill="#16222e" text-anchor="middle" transform="rotate(-90 845 240.0)">SEA</text><rect x="700" y="100" width="130" height="280" fill="#0e7c7b" opacity=".9"/><text x="765" y="130" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MARUVUR-PAKKAM</text><text x="765" y="150" font-size="11.5" fill="#fff" text-anchor="middle">port and industry</text><text x="765" y="168" font-size="11.5" fill="#fff" text-anchor="middle">guilds, warehouses</text><rect x="530" y="100" width="130" height="280" fill="#1a3a5c" opacity=".92"/><text x="595" y="130" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">PATTINAP-PAKKAM</text><text x="595" y="150" font-size="11.5" fill="#fff" text-anchor="middle">palace, merchants,</text><text x="595" y="168" font-size="11.5" fill="#fff" text-anchor="middle">brahmans, physicians</text><rect x="660" y="100" width="40" height="280" fill="#e8a020" opacity=".9"/><text x="680" y="240.0" font-size="11" font-weight="600" fill="#16222e" text-anchor="middle" transform="rotate(-90 680 240.0)">DAILY MARKET · buffer</text><text x="520" y="412" font-size="11.5" fill="#737b84">West</text><text x="830" y="412" font-size="11.5" fill="#737b84" text-anchor="end">East</text></svg>